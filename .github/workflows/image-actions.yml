# Image Actions will run in the following scenarios:
# - on Pull Requests containing images (not including forks)
# - on pushing of images to `main` (for forks)
# - on demand (https://github.blog/changelog/2020-07-06-github-actions-manual-triggers-with-workflow_dispatch/)
# - at 11 PM every Sunday in anything gets missed with any of the above scenarios
# For Pull Requests, the images are added to the PR.
# For other scenarios, a new PR will be opened if any images are compressed.
name: "Compress images"

on:
  pull_request: # PRs with image (but we can't push changes back to other forks)
    paths:
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"
      - "**.avif"

  push:
    branches:
      - "develop" # merging PRs from other forks (will open a new PR)
    paths:
      - "**.jpg"
      - "**.jpeg"
      - "**.png"
      - "**.webp"
      - "**.avif"

  workflow_dispatch: # on demand

  schedule:
    - cron: "0 0 * * 0" # every Sunday at midnight

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build:
    if: | # Only run on main repo on and PRs that match the main repo.
      github.repository == 'dnnsoftware/Dnn.Platform' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    name: "calibreapp/image-actions"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write" # used by calibreapp/image-actions
      pull-requests: "write" # used by peter-evans/create-pull-request
    steps:
      - name: "Checkout Repo"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false

      - name: "Compress Images"
        id: "compress_images"
        uses: "calibreapp/image-actions@9d037c06280028c110ff61c433ad4dc7d33c3c43" # 1.5.0
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          compressOnly: ${{ github.event_name != 'pull_request' }} # For non-Pull Requests, run in compressOnly mode and we'll PR after.

      - name: "Create Pull Request"
        if: | # If it's not a Pull Request then commit any changes as a new PR.
          github.event_name != 'pull_request' && steps.compress_images.outputs.markdown != ''
        uses: "peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1" # v8.1.1
        with:
          title: "Auto Compress Images"
          branch-suffix: "timestamp"
          commit-message: "Compress Images"
          body: ${{ steps.compress_images.outputs.markdown }}
